name: CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  artifact:
    name: Create artifact
    runs-on: ubuntu-26.04
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Login to private container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push Docker image
        env:
          FOOD_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker build . -t ${{ secrets.DOCKER_REGISTRY_HOST }}/food:latest
          docker push ${{ secrets.DOCKER_REGISTRY_HOST }}/food:latest

  deploy:
    name: Deploy artifact
    needs: [ artifact ]
    runs-on: ubuntu-26.04
    environment: Production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Run remote deployment script
        run: >-
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          "sh /cloud/scripts/food-deploy.sh"